name: Feature request
description: Suggest an idea for Command Code GUI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting. Describe the **workflow** you want, not just the widget.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem or gap?
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should it do? Rough UI sketch welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try?
