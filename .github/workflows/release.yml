name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build installers and draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + test
        run: npm run typecheck && npm test

      - name: Build
        run: npm run build

      # Installers are produced once the project adds electron-builder.
      # The pattern is:
      #   npx electron-builder --win --linux --mac
      # then attach the artifacts to the release below.

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
